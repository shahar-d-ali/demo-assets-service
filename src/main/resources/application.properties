spring.application.name=demo-assets-service

server.servlet.context-path=/api/assets
server.port=8001

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/demo_assets_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kafka Producer Configuration (assets-service is strictly a producer)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

# Disable devtools restart classloader to prevent ClassLoader conflict with KafkaAvroSerializer
spring.devtools.restart.enabled=false
